  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- rejilla sutil -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 64H1280M0 128H1280M0 192H1280M0 256H1280"/>
    <path d="M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
