  <text x="330" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700" fill="#FFFFFF" letter-spacing="1">Rig<tspan fill="#27D3A2">Warden</tspan></text>
  <text x="334" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#C9DAEA">El guardián de tu PC: vigila, limpia y afina tu rig.</text>
